# Runs Nexonic Sentinel every 30 minutes for every account that installed the GitHub App.
# Needs: repository variable SENTINEL_CLIENT_ID, secret SENTINEL_PRIVATE_KEY, optional secret OPENROUTER_API_KEY.
name: Sentinel

on:
  schedule:
    - cron: "7,37 * * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: Only log what would happen
        type: boolean
        default: false
      digest:
        description: Also post the weekly digest now
        type: boolean
        default: false

permissions:
  contents: read
  actions: write # only to keep this schedule from being disabled after 60 days without commits

concurrency:
  group: sentinel
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: pip install --require-hashes -r requirements.lock
      - name: Sentinel pass
        env:
          # The bot signs in as the GitHub App and serves every account that installed it.
          SENTINEL_CLIENT_ID: ${{ vars.SENTINEL_CLIENT_ID }}
          SENTINEL_PRIVATE_KEY: ${{ secrets.SENTINEL_PRIVATE_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          SENTINEL_DRY_RUN: ${{ inputs.dry_run && '1' || '' }}
        run: python -m sentinel ${{ inputs.digest && '--digest' || '' }}
      - name: Keep the schedule alive
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/sentinel.yml/enable" || true
