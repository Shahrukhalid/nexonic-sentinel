# Nexonic Sentinel settings. Changes take effect on the next run.
# Each repository can also add .github/nexonic-sentinel.toml to override features for itself.

owner = "Shahrukhalid"        # the account the bot works for; its own posts are skipped
mention_owner = false         # true = @mention the owner in comments (sends a notification email each time)
enabled = true                # false = the bot does nothing (emergency stop)
home_repo = "nexonic-sentinel"
skip_repos = ["Shahrukhalid"] # repositories the bot ignores (profile README)
lookback_hours = 72           # only new issues, PRs and discussions from this window

# AI budget. "auto" reads the OpenRouter key: 45 requests a day and 8 a run on a key without credits,
# 950 a day and 30 a run once the account has bought credits (OpenRouter then allows 1000 free requests a day).
daily_llm_budget = "auto"
max_llm_calls_per_run = "auto"
public_llm_calls_per_install = 3  # cap per run for accounts other than the owner that opted in to AI
max_installations = 50

# "all-free" = every free text model on OpenRouter, fetched live each run (new free models are picked up
# automatically). The biggest ones are listed first so they are tried first. The bot sticks with whichever
# model answers and skips any that hit their rate limit for the rest of the run.
models = [
  "nvidia/nemotron-3-ultra-550b-a55b:free",
  "nvidia/nemotron-3-super-120b-a12b:free",
  "google/gemma-4-31b-it:free",
  "all-free",
]
free_models_max = 20
exclude_models = ["content-safety", "guard", "2.6b"]  # classifiers and tiny models write poor fixes

[features]
# Defaults for the owner's own repositories. Other accounts start with ai = false and no automatic merges.
ai = true          # allow sending issue, discussion and code text to the models above
pr_review = true   # AI bug review of each new pull request commit
code_scan = true   # weekly code health report (a different set of files each week)

[review]
min_severity = "medium"   # high | medium | low
max_files = 30            # larger pull requests are skipped
max_patch_chars = 30000
post_when_clean = true    # also post a short "no likely bugs found" review

[scan]
files_per_week = 4
min_severity = "medium"
max_file_bytes = 15000

[contrib]
# Hourly hunt for open-source issues where maintainers asked for help. For each pick the bot reads the real files
# and drafts a fix, kept only if it applies cleanly to the current code (and parses, for Python).
# Picks are posted in the home repository only; the bot never comments or opens pull requests elsewhere.
enabled = true
every_hours = 1
languages = ["python", "typescript", "javascript"]
min_stars = 30
max_items = 2              # picks per hunt
max_age_days = 30
draft_fix = true
fix_files = 2              # files read for each fix
max_file_bytes = 20000

[automerge]
# Dependabot updates merged automatically once every check passes. Major updates always wait for you.
dependabot = ["patch", "minor"]
