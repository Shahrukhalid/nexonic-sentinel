# Nexonic Sentinel settings. Changes take effect on the next run.
# Each repository can also add .github/nexonic-sentinel.toml to override features for itself.

owner = "Shahrukhalid"        # the account the bot works for; its own posts are skipped
mention_owner = false         # true = @mention the owner in comments (sends a notification email each time)
enabled = true                # false = the bot does nothing (emergency stop)
home_repo = "nexonic-sentinel"
skip_repos = ["Shahrukhalid"] # repositories the bot ignores (profile README)
lookback_hours = 72           # only new issues, PRs and discussions from this window

# AI budget. "auto" reads the OpenRouter key: 45 requests a day and 8 a run on a key without credits,
# 950 a day and 30 a run once the account has bought credits (OpenRouter then allows 1000 free requests a day).
daily_llm_budget = "auto"
max_llm_calls_per_run = "auto"
public_llm_calls_per_install = 3  # cap per run for accounts other than the owner that opted in to AI
max_installations = 50

# "all-free" = every free text model on OpenRouter, fetched live each run (new free models are picked up
# automatically). The biggest ones are listed first so they are tried first. The bot sticks with whichever
# model answers and skips any that hit their rate limit for the rest of the run.
models = [
  "nvidia/nemotron-3-ultra-550b-a55b:free",
  "nvidia/nemotron-3-super-120b-a12b:free",
  "google/gemma-4-31b-it:free",
  "all-free",
]
free_models_max = 20
exclude_models = ["content-safety", "guard", "2.6b"]  # classifiers and tiny models write poor fixes

[features]
# Defaults for the owner's own repositories. Other accounts start with ai = false and no automatic merges.
ai = true          # allow sending issue, discussion and code text to the models above
pr_review = true   # AI bug review of each new pull request commit
code_scan = true   # weekly code health report (a different set of files each week)

[review]
min_severity = "medium"   # high | medium | low
max_files = 30            # larger pull requests are skipped
max_patch_chars = 30000
post_when_clean = true    # also post a short "no likely bugs found" review

[scan]
files_per_week = 4
min_severity = "medium"
max_file_bytes = 15000

[growth]
# One weekly "Growth inbox YYYY-Www" issue (label `growth`) in the home repository collects the suggestions below and
# closes last week's inbox. These features only run for the owner's own install and are off for everyone else.
# They only READ other projects: the bot never comments, opens issues or pull requests, stars, follows or reacts
# anywhere except in the home repository. Set enabled = false (or the top-level enabled = false) to stop it.
enabled = true

[contrib]
# Scout: fresh open issues (help wanted / good first issue / bug) in active projects, in the languages you use.
# Skips assigned issues, issues with an open linked pull request and issues with a recent "I'm working on this"
# comment. For each pick the bot reads the real files, drafts a fix kept only if it applies cleanly to the current
# code (and parses, for Python), and adds a short note on how to reproduce it and where the bug likely is.
enabled = true
languages = ["python", "typescript", "javascript"]
min_stars = 30
max_items = 3              # picks per week
fresh_days = 14            # issue updated within this many days
active_days = 60           # project pushed within this many days
claim_days = 21            # a "working on it" comment this recent counts as taken
max_checks = 20            # candidates inspected per run (caps API use)
draft_fix = true
fix_files = 2              # files read for each fix
max_file_bytes = 20000

[backlinks]
# Backlink finder: curated lists (awesome-*) matching the topics of your public repositories that are active, accept
# pull requests and do not mention the repository yet. The bot drafts the exact entry line and its section.
# Comment `submitted bl-<id>` or `declined bl-<id>` on the inbox to stop a suggestion from coming back.
enabled = true
max_items = 3              # suggestions per week
min_stars = 50
active_days = 180          # the list was pushed within this many days
max_searches = 10
max_reads = 15

[answers]
# Discussions helper: recent unanswered Q&A discussions in other active projects on your topics, with a drafted
# answer from the discussion plus the project's docs when available. Suggestions only; nothing is ever posted.
enabled = true
max_items = 3              # per week
max_age_days = 7
min_stars = 100
active_days = 60
# keywords = ["fastapi", "opencv"]   # default: the most common topics of your repositories

[automerge]
# Dependabot updates merged automatically once every check passes. Major updates always wait for you.
dependabot = ["patch", "minor"]

[iptv_review]
# Channel review for the owner's IPTV repository: a weekly "Channel review YYYY-Www" issue (label `channel-review`) listing
# pending records, `approve <id>` / `reject <id> <reason>` comments from the owner (nobody else), channel suggestions from
# the suggestion form turned into pending records (never approved automatically) and replies to broken-stream reports.
# Everything is written to the one repository below, which must belong to the owner. Decisions are committed to its
# default branch, so the GitHub App must be allowed to push there.
enabled = true
repo = "Shahrukhalid/nexonic-iptv"
weekday = "monday"           # the weekly issue is opened on this day (or the first run after it)
owner_login = "Shahrukhalid" # the only account whose commands are carried out
suggestions = true           # turn valid suggestion issues into pending records
broken_reports = true        # answer broken-stream reports with the latest status
max_rows = 80                # most records listed in the weekly issue
